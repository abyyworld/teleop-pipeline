name: pages

# The site is served straight from the default branch (Settings -> Pages,
# "Deploy from a branch", main, root), so nothing stands between a bad commit
# and the live page. This is that missing gate.

on:
  push:
    branches: [main]
    paths: ["index.html", "tools/check_page.py", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["index.html", "tools/check_page.py"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the browser the rendered checks need
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install --with-deps chromium

      - name: Check the page
        run: python tools/check_page.py index.html --render

      - name: The figures the page quotes must still be true
        run: |
          # The page states a test count for this repository, and it moves every
          # time code lands. Reading it from an explicit marker rather than from
          # prose means a redesign cannot silently disconnect this check:
          #   <span data-check="tests">139</span>
          pip install -e ".[dev]"
          collected=$(python -m pytest --collect-only -q 2>/dev/null \
            | awk -F': ' '/: [0-9]+$/ {s+=$2} END {print s}')
          claimed=$(grep -oE 'data-check="tests"[^>]*>[0-9,]+' index.html \
            | grep -oE '[0-9,]+$' | tr -d ',')
          echo "collected=$collected claimed=$claimed"
          if [ -z "$claimed" ]; then
            echo 'index.html carries no data-check="tests" marker, so its test' >&2
            echo 'count cannot be verified. Add the marker or remove the claim.' >&2
            exit 1
          fi
          if [ "$collected" != "$claimed" ]; then
            echo "the page says $claimed tests, the suite collects $collected" >&2
            exit 1
          fi
