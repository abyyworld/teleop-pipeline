name: pages

# The site is served straight from the default branch (Settings -> Pages,
# "Deploy from a branch", main, root), so nothing here deploys it. What this
# does is keep the page honest, because a branch deploy will happily publish a
# broken one.

on:
  push:
    branches: [main]
    paths: ["index.html", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["index.html"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The page must not reference anything it cannot serve
        run: |
          # No external scripts, styles or fonts: the site has to render on a
          # lab machine with no outbound network, and a third-party request
          # from this page would also be a tracking vector.
          if grep -nEi '<(script|link)[^>]+(src|href)="https?://' index.html; then
            echo "external resource referenced above" >&2
            exit 1
          fi

      - name: Every tag must be balanced
        run: |
          python - <<'CHECK'
          import html.parser
          import sys

          src = open("index.html", encoding="utf-8").read()
          stack = []
          void = {"br", "hr", "img", "meta", "link", "input", "source", "path",
                  "line", "circle", "rect", "use"}

          class P(html.parser.HTMLParser):
              def handle_starttag(self, tag, attrs):
                  if tag not in void:
                      stack.append(tag)
              def handle_endtag(self, tag):
                  # An unbalanced document still renders, just not as written.
                  if tag in void:
                      return
                  if not stack or stack[-1] != tag:
                      sys.exit(f"tag mismatch: </{tag}> closes {stack[-1:] or ['nothing']}")
                  stack.pop()

          P().feed(src)
          if stack:
              sys.exit(f"unclosed tags: {stack}")
          print(f"page parses, {len(src)} bytes, every tag balanced")
          CHECK

      - name: The figures on the page must match the repositories
        run: |
          # The page quotes this repository's own line and test counts. They
          # drift every time code lands, and a stale number on a public page is
          # the kind of thing a reader checks.
          lines=$(git ls-files '*.py' | xargs cat | wc -l | tr -d ' ')
          claimed=$(grep -oE '[0-9,]+ lines &middot; [0-9]+ tests' index.html | head -1 | grep -oE '^[0-9,]+' | tr -d ',')
          echo "repository: $lines lines, page claims: $claimed"
          if [ "$lines" != "$claimed" ]; then
            echo "the page's line count for this repository is stale" >&2
            exit 1
          fi
