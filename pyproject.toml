[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teleop-pipeline"
version = "0.1.0"
description = "Versioned, validated, reproducible teleoperation demonstration pipeline for robot policy learning"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "abyyworld" }]
keywords = ["robotics", "teleoperation", "imitation-learning", "data-engineering", "mlops"]

# Core stays deliberately light: ingest / validate / score / dataset run with
# nothing but the scientific-Python baseline. Every heavy dependency (torch,
# mlflow, prefect, dvc) is an extra and is imported lazily, so CI and a fresh
# clone stay fast and the pipeline degrades gracefully instead of crashing.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "pydantic>=2.5",
    "typer>=0.9",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
train = ["torch>=2.1"]
track = ["mlflow>=2.9"]
orchestrate = ["prefect>=2.14"]
data = ["dvc>=3.30", "dvc-s3>=3.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.3"]
all = [
    "torch>=2.1",
    "mlflow>=2.9",
    "prefect>=2.14",
    "dvc>=3.30",
    "dvc-s3>=3.0",
]

[project.scripts]
teleop-pipeline = "teleop_pipeline.cli:app"

[project.urls]
Repository = "https://github.com/abyyworld/teleop-pipeline"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
